/* 이달의 게임왕 배너 (화려한 애니메이션) */
.king{position:relative;overflow:hidden;border-radius:20px;padding:14px 13px 14px;margin-bottom:12px;background:radial-gradient(circle at 50% 0%,#6a3fd0 0%,#3a2380 55%,#1e1450 100%);border:2px solid #ffd54f;box-shadow:0 8px 26px rgba(90,40,180,.38);text-align:center}
.king.empty{padding:16px 14px 15px}
.king.empty .king-rays{opacity:.5}
.king-crown.sm{font-size:26px;margin-top:6px}
.king.clk{cursor:pointer}
.king-rays{position:absolute;left:50%;top:30%;width:380px;height:380px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,213,79,.13) 0deg 9deg,transparent 9deg 18deg);animation:kRays 18s linear infinite;pointer-events:none}
@keyframes kRays{to{transform:translate(-50%,-50%) rotate(360deg)}}
.king>*:not(.king-rays){position:relative;z-index:1}
.king-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 14px;color:#ffe082;font-size:12px;font-weight:800;backdrop-filter:blur(3px)}
.king-crown{font-size:32px;line-height:1;margin-top:8px;animation:kCrown 1s cubic-bezier(.34,1.56,.64,1) both,kFloat 2.6s ease-in-out 1s infinite}
@keyframes kCrown{0%{opacity:0;transform:translateY(-34px) scale(.3) rotate(-25deg)}60%{transform:translateY(5px) scale(1.28) rotate(10deg)}100%{opacity:1;transform:none}}
@keyframes kFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.king-name{font-size:27px;font-weight:900;margin:3px 0 8px;background:linear-gradient(90deg,#fff 0%,#ffe27a 30%,#fff 50%,#ffe27a 70%,#fff 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:kName .7s cubic-bezier(.34,1.56,.64,1) both,kShim 3.2s linear infinite;text-shadow:0 0 18px rgba(255,213,79,.5)}
@keyframes kName{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes kShim{to{background-position:220% center}}
.king-medal{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:6px 16px;color:#ffe082;font-size:14px;font-weight:800;animation:kPop .5s .3s both}
@keyframes kPop{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}}

.king-pod .kp-m{font-size:17px}.king-pod .kp b{flex:1;color:#eceff1;font-size:13px;font-weight:800;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.king-pod .kp i{color:#ffd54f;font-size:12.5px;font-weight:800;font-style:normal}

window.adImportXlsx=function(inp){
  var f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  function go(){
    var rd=new FileReader();
    rd.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        var ws=wb.Sheets['기사연락처']||wb.Sheets['기사정보']||wb.Sheets[wb.SheetNames[0]];
        var arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(!arr.length){alert('빈 파일입니다.');return;}
        var hdr=arr[0].map(function(x){return String(x||'').trim();});
        function ci(names){for(var i=0;i<hdr.length;i++){if(names.indexOf(hdr[i])>=0)return i;}return -1;}
        var cN=ci(['기사명','이름','성명']),cI=ci(['아이디','ID','id']),cP=ci(['전화번호','전화','연락처']),cS=ci(['상태']),cR=ci(['역할','직급']),cB=ci(['생년월일','생일']),cV=ci(['차량번호','차량']);
        if(cN<0){alert('기사명 컬럼을 찾지 못했습니다.\n헤더: 기사명·아이디·전화번호·상태·역할·생년월일·차량번호');return;}
        var rows=[];
        for(var r=1;r<arr.length;r++){var row=arr[r]||[];var nm=String(row[cN]||'').trim();if(!nm)continue;
          rows.push({name:nm,id:cI>=0?String(row[cI]||'').trim():'',phone:cP>=0?String(row[cP]||'').trim():'',status:cS>=0?String(row[cS]||'').trim():'',role:cR>=0?String(row[cR]||'').trim():'',birth:cB>=0?String(row[cB]||'').trim():'',vehicle:cV>=0?String(row[cV]||'').trim():''});}
        if(!rows.length){alert('인식된 기사가 없습니다.');return;}
        rpc("admin_import_drivers",{p_token:S.token,p_rows:rows}).then(function(res){alert('✅ 기사 권한·정보 적용 완료 (앱에 저장됨)\n\n· 업데이트: '+(res.updated||0)+'명'+(res.missing?('\n· 미매칭(앱에 없는 이름): '+res.missing+'명'):''));loadAdmin();}).catch(function(err){alert(err.message);});
      }catch(err){alert('엑셀 처리 오류: '+err.message);}
    };rd.readAsArrayBuffer(f);
  }
  if(window.XLSX)go();
  else{var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=go;s.onerror=function(){alert('엑셀 라이브러리 로드 실패 (인터넷 연결을 확인하세요)');};document.head.appendChild(s);}
};

var GM={};
var GM_IC=['📦','🚚','🧊','🍱','🅿️','🔔','🏢','📮','🛒','🎁','📋','🗺️'];
function gMatchStart(){var st=document.getElementById('g-stage');if(!st)return;
  var W=Math.max(300,Math.min((window.innerWidth||360)-14,430));var pad=12,gap=8,cw=Math.floor((W-2*pad-3*gap)/4),chh=Math.round(cw*0.92),H=pad*2+6*chh+5*gap+34;
  st.innerHTML='<div style="text-align:center"><canvas id="gmc" width="'+W+'" height="'+H+'" style="border-radius:16px;max-width:100%;max-height:92vh;display:block;margin:0 auto;touch-action:manipulation;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.25)"></canvas><div style="font-size:11px;color:#90a4ae;margin-top:8px">카드를 뒤집어 같은 그림을 맞춰요 · 빠를수록 1등! 🎴</div></div>';
  if(GH.raf){try{cancelAnimationFrame(GH.raf);}catch(e){}}var my=++GH.gen;
  var arr=[];for(var i=0;i<12;i++){arr.push(i);arr.push(i);}for(var i2=arr.length-1;i2>0;i2--){var j=Math.floor(Math.random()*(i2+1));var x=arr[i2];arr[i2]=arr[j];arr[j]=x;}
  var cards=arr.map(function(v){return {v:v,a:0,ta:0,m:0};});
  GM={cv:document.getElementById('gmc'),cx:document.getElementById('gmc').getContext('2d'),W:W,H:H,pad:pad,gap:gap,cw:cw,chh:chh,cards:cards,sel:[],lock:false,start:0,done:false,elapsed:0,t:0};
  GM.cv.onpointerdown=gMatchTap;document.removeEventListener('keydown',gMatchKey);document.addEventListener('keydown',gMatchKey);
  ghLoad('match');
  (function loop(){if(my!==GH.gen||GH.view!=='match'||!GM.cx)return;var g=GM,c=g.cx;g.t++;
    if(g.start&&!g.done)g.elapsed=(Date.now()-g.start)/1000;
    for(var i=0;i<24;i++){var cd=g.cards[i];cd.a+=(cd.ta-cd.a)*0.28;}
    c.fillStyle=gLG(c,0,0,0,g.H,'#eef2f7','#dbe4ee');c.fillRect(0,0,g.W,g.H);
    for(var k=0;k<24;k++){var cd2=g.cards[k];var col=k%4,row=Math.floor(k/4);var cx=g.pad+col*(g.cw+g.gap),cy=34+g.pad+row*(g.chh+g.gap);
      var sx=Math.abs(Math.cos(cd2.a));var ww=g.cw*sx,front=cd2.a>Math.PI/2;
      c.save();if(cd2.m){c.shadowColor='rgba(60,200,120,.7)';c.shadowBlur=9;}
      c.fillStyle=cd2.m?'#e7f8ee':(front?'#ffffff':gLG(c,cx,cy,cx,cy+g.chh,'#3a8de0','#1565c0'));gRR(c,cx+(g.cw-ww)/2,cy,ww,g.chh,7);c.fill();c.restore();
      c.strokeStyle=cd2.m?'#2e9e5b':'rgba(0,0,0,.1)';c.lineWidth=cd2.m?2:1;gRR(c,cx+(g.cw-ww)/2,cy,ww,g.chh,7);c.stroke();
      if(sx>0.55){if(front){c.font=Math.round(g.cw*0.5)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(GM_IC[cd2.v],cx+g.cw/2,cy+g.chh/2);}else{c.fillStyle='rgba(255,255,255,.9)';c.font='800 '+Math.round(g.cw*0.28)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('TF',cx+g.cw/2,cy+g.chh/2);}}
      c.textBaseline='alphabetic';}
    var left=g.cards.filter(function(cd){return !cd.m;}).length/2;
    c.fillStyle='#37474f';c.font='800 14px sans-serif';c.textAlign='left';c.fillText('⏱ '+g.elapsed.toFixed(1)+'초',12,24);c.textAlign='right';c.fillText('남은 짝 '+left,g.W-12,24);
    if(g.done){c.fillStyle='rgba(0,0,0,.55)';gRR(c,g.W/2-120,g.H/2-44,240,90,14);c.fill();c.fillStyle='#fff';c.textAlign='center';c.font='900 22px sans-serif';c.fillText('🎉 클리어!',g.W/2,g.H/2-8);c.font='800 15px sans-serif';c.fillText('기록 '+g.elapsed.toFixed(1)+'초 · 탭해서 재시작',g.W/2,g.H/2+20);}
    GH.raf=requestAnimationFrame(loop);})();}
function gMatchTap(e){var g=GM;if(!g.cx)return;if(g.done){gMatchStart();return;}if(g.lock)return;
  var rect=g.cv.getBoundingClientRect();var px=(e.clientX-rect.left)/rect.width*g.W,py=(e.clientY-rect.top)/rect.height*g.H;

window.ensurePush=async function(interactive){try{

  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:_pu8(VAPID_PUBLIC)});

}

window.pbDecide=async(id,st)=>{try{
    await rpc("admin_pback_decide",{p_token:S.token,p_id:id,p_status:st});
    if(st==="제출완료"){var s=((__PB_DASH&&__PB_DASH.pending)||[]).find(function(x){return x.id===id;});if(s){var ok=await pbFormSubmit({date:s.pdate,wave:s.wave,camp:s.camp,route:s.route,reason:s.reason});msg("#pb-adm-msg",ok?"ok":"err",ok?("✅ "+(s.name||"")+" · "+(s.route||"")+" 승인·서베이 전송"):"승인됨(서베이 전송 실패·폼URL 확인)");}}
    renderPbackAdmin();
  }catch(e){alert(e.message);}};
async function renderPbackAdmin(){
  const box=$("#pb-admin");box.innerHTML='<div class="center">불러오는 중…</div>';
  try{
    const d=await rpc("admin_pback_dashboard",{p_token:S.token,p_period:pbPeriod()});
    __PB_DASH=d;const cfg=d.config||{};PB_FORM.url=cfg.form_url||"";if(cfg.submit_mode)__PB_MODE=cfg.submit_mode;
    var ns=d.not_submitted||[],pend=d.pending||[],done=d.submitted||[],imp=d.impossible||[];
    let h='<div class="admnav"><b>🧾 프백 소명 · 관리자</b><span style="font-size:11px;color:#98a3b3">'+d.period+'</span></div>';
    h+=pbDeadlineBanner();
    h+='<div class="admstat pb-stat"><div class="s"><div class="l">대상</div><div class="v">'+(d.target_cnt||0)+'</div></div><div class="s"><div class="l">제출완료</div><div class="v">'+(d.submitted_cnt||0)+'</div></div><div class="s"><div class="l">소명불가</div><div class="v">'+(d.impossible_cnt||0)+'</div></div><div class="s main"><div class="l">미제출</div><div class="v">'+(d.not_submitted_cnt||0)+'</div></div></div>';
    h+='<div class="card"><div class="ct" style="font-size:13px">📋 미제출 명단 · '+ns.length+'명 / '+(d.not_submitted_cnt||0)+'건 <span style="margin-left:auto;font-size:10px;color:#98a3bd;font-weight:600">기사별</span></div>';
    if(!ns.length)h+='<div class="center" style="color:#1f7a4d;font-weight:700;font-size:12px;padding:8px">미제출 없음 ✅</div>';
    else{h+='<table class="pbmm"><tr><th>기사명</th><th>라우트</th><th style="text-align:center">건수</th><th style="text-align:right">상태</th></tr>';ns.forEach(function(x){h+='<tr><td>'+escN(x.name||"")+'</td><td style="color:#66748f">'+escN(x.routes||"")+'</td><td style="text-align:center"><b>'+x.cnt+'</b></td><td style="text-align:right"><span class="'+(x.state==="반려"?"s-rej":"s-todo")+'">'+x.state+'</span></td></tr>';});h+='</table>';}
    h+='</div>';
    h+='<div class="card"><div style="font-size:11px;font-weight:800;color:#3a5aa8;margin-bottom:6px">📄 소명 제출 폼 URL</div><div class="adr-ct"><input id="pb-formurl" value="'+(cfg.form_url||"")+'" placeholder="https://docs.google.com/forms/..."><button onclick="pbSaveUrl()">저장</button></div><div class="msg" id="pb-adm-msg"></div>';
    h+='<div style="font-size:11px;font-weight:800;color:#3a5aa8;margin:9px 0 6px">제출 방식</div><div class="pbmode">'+["직접","승인","일괄"].map(function(m,i){return '<div class="pbmd'+(__PB_MODE===m?" on":"")+'" onclick="pbSetMode(\''+m+'\')"><b>'+["①","②","③"][i]+'</b>'+m+'</div>';}).join('')+'</div>';
    h+='<div class="note" style="margin-top:6px">대상 명단은 소원 스케줄 프로그램에서 업로드하면 자동 반영됩니다.</div></div>';
    h+='<div class="card"><div class="ct">🕓 승인 대기 ('+(d.pending_cnt||0)+')</div>';
    if(!pend.length)h+='<div class="center" style="color:#9aa;font-size:12px">없음</div>';
    pend.forEach(function(s){h+='<div class="somyeong"><div class="top"><span class="rt">'+escN(s.name||"")+' · '+escN(s.route||"")+' <small style="color:#98a3bd">'+pbWD(s.pdate)+'</small></span><span><button class="mini" onclick="pbDecide('+s.id+',\'제출완료\')">✓ 승인</button> <button class="mini" style="background:#f3e9fb;color:#7e3fb0" onclick="pbDecide('+s.id+',\'반려\')">반려</button></span></div><div style="color:#666;font-size:12px">'+escN(s.reason||"")+'</div></div>';});
    h+='</div>';
    h+='<div class="ntfold" onclick="pbAcc(this)"><span>✅ 제출완료 ('+(d.submitted_cnt||0)+')</span><span class="fa">▾</span></div><div class="ntfoldbody" style="display:none">';
    if(!done.length)h+='<div class="center" style="color:#9aa;font-size:12px;padding:8px">없음</div>';
    done.forEach(function(s){h+='<div class="somyeong"><div class="top"><span class="rt">'+escN(s.name||"")+' · '+escN(s.route||"")+'</span><span class="pill p-sub">제출완료</span></div><div style="color:#666;font-size:12px">'+escN(s.reason||"")+'</div></div>';});
    h+='</div>';
    h+='<div class="ntfold" onclick="pbAcc(this)"><span>🚫 소명불가 ('+(d.impossible_cnt||0)+')</span><span class="fa">▾</span></div><div class="ntfoldbody" style="display:none">';
    if(!imp.length)h+='<div class="center" style="color:#9aa;font-size:12px;padding:8px">없음</div>';
    imp.forEach(function(s){h+='<div class="somyeong"><div class="top"><span class="rt">'+escN(s.name||"")+' · '+escN(s.route||"")+'</span><span class="pill p-imp">소명불가</span></div></div>';});
    h+='</div>';
    box.innerHTML=h;
  }catch(e){box.innerHTML='<div class="center">'+e.message+'</div>';}
}
/* 설정 */
const IS_ADMIN=()=>S&&(S.is_admin||S.rank==="대표");
function setMenu(){$("#set-menu").classList.remove("hide");$("#set-sub").classList.add("hide");$("#mi-perm").classList.toggle("hide",!IS_ADMIN());$("#me-info").innerHTML='<div class="kv"><span>이름</span><b>'+S.name+'</b></div><div class="kv"><span>직급</span><b>'+S.rank+'</b></div>'+(IS_ADMIN()?'<div class="kv"><span>관리자</span><b>예</b></div>':'');}
function openSub(name){$("#set-menu").classList.add("hide");$("#set-sub").classList.remove("hide");["pw","me","perm"].forEach(x=>$("#sub-"+x).classList.toggle("hide",x!==name));if(name==="perm")loadAdmin();}
document.addEventListener("click",e=>{if(e.target.id==="set-back"){setMenu();return;}const mi=e.target.closest?e.target.closest(".menu-item"):null;if(!mi)return;if(mi.id==="mi-logout"){localStorage.removeItem("sowon_session");location.reload();}else openSub(mi.id.replace("mi-",""));});
const RANKS=["대표","총괄","팀장","조장","일반","백업"];
async function loadAdmin(){$("#ad-list").innerHTML='<div class="center">불러오는 중…</div>';try{var rows=await rpc("admin_list_drivers",{p_token:S.token});try{var cp=await rpc("admin_list_coupang",{p_token:S.token});var m={};(cp||[]).forEach(function(x){m[x.nm]=x.cid;});rows.forEach(function(r){r.coupang_id=m[r.name]||"";});}catch(e){}window.__adrows=rows;renderAdmin();}catch(e){$("#ad-list").innerHTML='<div class="center">'+e.message+'</div>';}}
function renderAdmin(){
  const RORD={"대표":0,"총괄":1,"팀장":2,"백업":3,"조장":4,"일반":5};const GCLS={"대표":"g-dae","총괄":"g-chg","팀장":"g-tea","백업":"g-bk","조장":"g-jo","일반":"g-il"};
  const q=($("#ad-search").value||"").trim();let rows=(window.__adrows||[]).slice().sort((a,b)=>((RORD[a.rank]??9)-(RORD[b.rank]??9))||a.name.localeCompare(b.name));if(q)rows=rows.filter(r=>r.name.includes(q));
  let h="",cur=null;
  rows.forEach(r=>{if(r.rank!==cur){cur=r.rank;h+='<div class="ad-grp '+(GCLS[r.rank]||'')+'">'+r.rank+'</div>';}
    const off=r.status!=="active";
    h+='<div class="adr'+(off?" off":"")+' '+(GCLS[r.rank]?GCLS[r.rank].replace("g-","r-"):"")+'" data-name="'+r.name+'"><div class="adr-top"><b>'+r.name+'</b>'
      +(r.is_admin?'<span class="abadge">관리자</span>':'')+(off?'<span class="obadge">'+r.status+'</span>':'')
      +'<span class="adr-id">'+(r.driver_id||'')+'</span></div>'
      +'<div class="adr-ctrl"><select class="ad-rank">'+RANKS.map(rk=>'<option'+(rk===r.rank?" selected":"")+'>'+rk+'</option>').join('')+'</select>'
      +'<button class="ad-adm">'+(r.is_admin?"관리자해제":"관리자지정")+'</button>'
      +'<button class="ad-stat">'+(off?"복구":"정지")+'</button><button class="ad-pw">PW초기화</button></div>'
      +'<div class="adr-ct">📞<input class="ad-ph" value="'+(r.phone||'')+'" placeholder="전화"><input class="ad-vh" value="'+(r.vehicle_no||'')+'" placeholder="차량번호"></div>'+'<div class="adr-ct" style="margin-top:5px">🎂<input class="ad-bd" value="'+String(r.birth||'').replace(/"/g,'&quot;')+'" placeholder="생년월일 (예:1990-01-01)"><input class="ad-cp" value="'+String(r.coupang_id||'').replace(/"/g,'&quot;')+'" placeholder="쿠팡 ID"><button class="ad-save">저장</button></div></div>';});
  $("#ad-list").innerHTML=h||'<div class="center">기사가 없습니다.</div>';
  $("#ad-list").querySelectorAll(".adr").forEach(row=>{const nm=row.dataset.name;const cur=()=>window.__adrows.find(x=>x.name===nm);
    row.querySelector(".ad-rank").onchange=e=>adUpd(nm,{p_rank:e.target.value});
    row.querySelector(".ad-adm").onclick=()=>adUpd(nm,{p_is_admin:!cur().is_admin});
    row.querySelector(".ad-stat").onclick=()=>adUpd(nm,{p_status:cur().status==="active"?"정지":"active"});
    row.querySelector(".ad-pw").onclick=()=>adResetPw(nm);
    row.querySelector(".ad-save").onclick=()=>adSaveInfo(nm,row);});
}
async function adUpd(name,fields){try{await rpc("admin_update_driver",Object.assign({p_token:S.token,p_name:name,p_rank:null,p_status:null,p_is_admin:null,p_phone:null,p_vehicle_no:null,p_vehicle_type:null,p_birth:null,p_is_ev:null,p_is_public:null},fields));await loadAdmin();}catch(e){alert(e.message);}}
async function adSaveInfo(name,row){try{await rpc("admin_save_driver_info",{p_token:S.token,p_name:name,p_phone:row.querySelector(".ad-ph").value,p_vehicle_no:row.querySelector(".ad-vh").value,p_birth:row.querySelector(".ad-bd").value,p_coupang_id:row.querySelector(".ad-cp").value});await loadAdmin();}catch(e){alert(e.message);}}
async function adResetPw(name){if(!confirm(name+" 비밀번호를 1234로 초기화할까요?"))return;try{await rpc("admin_reset_pw",{p_token:S.token,p_name:name});alert("초기화됨 (비번 1234)");}catch(e){alert(e.message);}}
document.addEventListener("input",e=>{if(e.target.id==="ad-search")renderAdmin();});
document.addEventListener("click",e=>{if(e.target.id==="ad-add"){(async()=>{const name=prompt("기사명");if(!name)return;const rank=prompt("직급 (대표/총괄/팀장/조장/일반/백업)","일반")||"일반";const phone=prompt("전화번호(선택)","")||"";const vh=prompt("차량번호(선택)","")||"";try{await rpc("admin_add_driver",{p_token:S.token,p_name:name,p_rank:rank,p_phone:phone,p_vehicle_no:vh});await loadAdmin();alert(name+" 추가됨 (비번 1234)");}catch(err){alert(err.message);}})();}});
$("#pw-btn").onclick=async()=>{
  const o=$("#pw-old").value,n=$("#pw-new").value;if(!o||!n){msg("#pw-msg","err","입력하세요.");return;}
  try{const ok=await rpc("change_password",{p_token:S.token,p_old:o,p_new:n});
    if(ok){msg("#pw-msg","ok","변경되었습니다.");$("#pw-old").value="";$("#pw-new").value="";}else msg("#pw-msg","err","현재 비밀번호가 틀렸습니다.");
  }catch(e){msg("#pw-msg","err",e.message);}
};
$("#logout").onclick=()=>{localStorage.removeItem("sowon_session");location.reload();};
/* 자동로그인 */
(function(){const raw=localStorage.getItem("sowon_session");if(raw){try{S=JSON.parse(raw);enterApp();}catch(e){}}})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

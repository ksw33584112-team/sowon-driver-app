<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b6b">
<title>소원물류 기사앱</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f0f2f5;color:#1a1a1a}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
/* 로그인 */
#login{min-height:100vh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.llogo{width:74px;height:74px;background:rgba(255,255,255,.15);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:12px}
.ltit{color:#fff;font-size:30px;font-weight:900;letter-spacing:7px}
.lsub{color:rgba(255,255,255,.6);font-size:12px;margin:6px 0 26px}
.lbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:380px}
.lbox h2{font-size:16px;color:#333;margin-bottom:16px}
.fg{margin-bottom:12px}.fg label{display:block;font-size:10px;font-weight:700;color:#888;letter-spacing:.5px;margin-bottom:5px}
input,textarea{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#222;outline:none}
input:focus,textarea:focus{border-color:#1565c0;background:#fff}
.btn-p{width:100%;padding:13px;background:linear-gradient(135deg,#1565c0,#1976d2);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;margin-top:6px;cursor:pointer}
.btn-p:active{opacity:.9}.btn-p:disabled{opacity:.5}
.lhint{margin-top:12px;padding:11px;background:#f3f4ff;border-radius:8px;font-size:11px;color:#5c6bc0;line-height:1.7;border-left:3px solid #5c6bc0}
/* 앱 */
#app{display:none;min-height:100vh;flex-direction:column}
.ah{background:linear-gradient(135deg,#0d1b6b,#1565c0);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.av{width:34px;height:34px;background:rgba(255,255,255,.22);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.an{font-size:14px;font-weight:700}.ar{font-size:10px;opacity:.75}
.lo{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 11px;border-radius:8px;font-size:11px;cursor:pointer}
.mc{flex:1;padding:14px;padding-bottom:76px}
.scr{display:none}.scr.on{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ct{font-size:14px;font-weight:800;color:#1a237e;margin-bottom:12px}
.wknav{display:flex;align-items:center;justify-content:space-between;background:#eef2fb;border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px;font-weight:700;color:#1565c0}
.wknav button{background:none;border:none;color:#1565c0;font-weight:700;font-size:13px;cursor:pointer;padding:2px 6px}
.wkbtns{display:flex;gap:8px;margin:-4px 0 12px}
.wkbtns button{flex:1;padding:9px;border:none;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer}
#wk-today{background:#e7f0ff;color:#1565c0}
#wk-edit{background:#fff2e0;color:#e8862e}
#wk-edit.on{background:#e8862e;color:#fff}
.camp{background:#e8f0fe;color:#1565c0;font-weight:800;font-size:12px;padding:6px 10px;border-radius:8px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #e8eaf0;padding:5px 3px;text-align:center}
th{background:#f5f7fb;color:#5c6bc0;font-weight:700}
.chip{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;color:#fff;background:#1976d2;cursor:default}
.chip.ed{cursor:pointer;text-decoration:none}
.sum{background:linear-gradient(135deg,#1565c0,#1976d2);color:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
.sum .lbl{font-size:11px;opacity:.85}.sum .amt{font-size:25px;font-weight:900;margin-top:2px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:13px;color:#444}
.kv:last-child{border:none}.kv b{font-weight:800;color:#222}
.kv.minus b{color:#e53935}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.mrow:last-child{border:none}
.mini{background:#eef2fb;color:#1565c0;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.st-head{display:flex;gap:8px;margin-bottom:12px}
.st-head .col{flex:1;background:#f5f7fb;border:1px solid #e6ebf5;border-radius:12px;padding:12px}
.st-head .col.main{background:linear-gradient(135deg,#1565c0,#1976d2);border:none;color:#fff}
.st-head .col .l{font-size:11px;opacity:.8}.st-head .col.main .l{opacity:.9}
.st-head .col .v{font-size:19px;font-weight:900;margin-top:3px;letter-spacing:-.5px}
.stbl{width:100%;border-collapse:collapse;font-size:12.5px}
.stbl th{background:#f3f6fb;color:#5a6b85;font-weight:700;padding:7px 6px;text-align:right;border-bottom:1px solid #e6ebf5}
.stbl th:first-child{text-align:left}
.stbl td{padding:8px 6px;text-align:right;border-bottom:1px solid #f2f2f2;color:#333}
.stbl td:first-child{text-align:left;color:#555}
.stbl tr.minus td{color:#e53935}
.stbl tr.tot td{font-weight:900;color:#111;border-top:2px solid #dbe3f0;background:#fafbfe}
.stbl tr.tot.main td{color:#1565c0;font-size:14px}
.stbl td.r{text-align:right}
.stbl tr.clk{cursor:pointer}.stbl tr.clk:active{background:#eef4ff}
.note{font-size:10.5px;color:#98a3b3;margin-top:8px}
.stbl-wrap{max-height:340px;overflow:auto;border:1px solid #eef1f6;border-radius:8px}
.stbl.day th{position:sticky;top:0;text-align:center}.stbl.day th:first-child,.stbl.day th:nth-child(2){text-align:left}
.stbl.day td{text-align:center}.stbl.day td:first-child,.stbl.day td:nth-child(2){text-align:left}
.stbl.day tr.tot td{position:sticky;bottom:0}
.segtab{display:flex;gap:6px;margin-bottom:12px}
.segtab button{flex:1;padding:9px;border:1px solid #dbe3f0;background:#fff;color:#7a8699;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.segtab button.on{background:#1565c0;color:#fff;border-color:#1565c0}
.admnav{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e6ebf5;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px}
.admnav button{background:#eef2fb;color:#1565c0;border:none;width:34px;height:30px;border-radius:7px;font-size:15px;font-weight:800;cursor:pointer}
.admstat{display:flex;gap:8px;margin-bottom:12px}
.admstat .s{flex:1;background:#f5f7fb;border:1px solid #e6ebf5;border-radius:11px;padding:10px 8px;text-align:center}
.admstat .s.main{background:linear-gradient(135deg,#1565c0,#1976d2);border:none;color:#fff}
.admstat .s .l{font-size:10px;color:#8a94a6}.admstat .s.main .l{color:#dbe9ff}
.admstat .s .v{font-size:14px;font-weight:900;margin-top:3px;letter-spacing:-.5px}
.rkchip{display:inline-block;font-size:10px;font-weight:800;color:#fff;padding:2px 7px;border-radius:20px;background:#9aa5b5}
.rkchip.dae{background:#c79a1e}.rkchip.chg{background:#7e57c2}.rkchip.tea{background:#e8862e}.rkchip.jo{background:#1976d2}.rkchip.bk{background:#16a08c}
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.p-wait{background:#fff3e0;color:#ef6c00}.p-done{background:#e8f5e9;color:#2e7d32}
.somyeong{border:1px solid #eee;border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px}
.somyeong .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.somyeong .rt{font-weight:800;color:#1a237e}
.notice{background:#fff8e1;border-radius:8px;padding:9px;font-size:11px;color:#795548;line-height:1.6;margin-bottom:10px}
.center{text-align:center;color:#9aa0ad;padding:22px 0;font-size:13px}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.msg.err{background:#fdecea;color:#c0392b;display:block}.msg.ok{background:#e8f5e9;color:#2e7d32;display:block}
label.fl{display:block;font-size:11px;color:#888;font-weight:700;margin:10px 0 5px}
.bn{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:#fff;display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:60}
.bn button{flex:1;border:none;background:none;padding:9px 0 12px;font-size:10px;color:#9aa0ad;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bn button .ic{font-size:19px}.bn button.on{color:#1565c0}
.hide{display:none!important}

.camp-card{background:#fff;border:1px solid #dfe3ea;border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.camp-head{background:linear-gradient(135deg,#2f5b3f,#3f7a52);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.camp-head .rc{font-size:11px;font-weight:600;opacity:.92}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-inner{position:relative;width:max-content;min-width:100%}
table.sched{width:max-content;min-width:100%;border-collapse:collapse;font-size:10px}
table.sched th,table.sched td{border:1px solid #e3e6ec;padding:6px 4px;text-align:center;white-space:nowrap;min-width:42px}
td.cRoute{min-width:52px}
th.tcol,td.tcol{font-size:13px;font-weight:800;min-width:62px}
table.sched th{background:#eef2f6;color:#3a4a5a;font-weight:700;line-height:1.25}
table.sched th.we{background:#d9efef;color:#1c6b6b}
th.tcol{background:#ffe4c2;color:#8a5300}
td.cRoute{background:#f2f5fb;color:#26324a;font-weight:800}
td.tbg{background:#fff6e8}
td.rk{color:#fff;font-weight:700}
td.dae{background:#c79a1e}td.chg{background:#7e57c2}td.tea{background:#e8862e}td.jo{background:#1976d2}td.bk{background:#16a08c}
.tlbl{display:block;font-size:9px;color:#e8862e;font-weight:800;animation:blink .9s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@property --sa{syntax:"<angle>";initial-value:0deg;inherits:false}
.today-box{position:absolute;pointer-events:none;border-radius:9px;z-index:6;padding:3px;background:conic-gradient(from var(--sa),#ff8f00,#ffd591,#ff5d00,#ffd591,#ff8f00);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 1.4s linear infinite,glow 1s ease-in-out infinite}
@keyframes spin{to{--sa:360deg}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px rgba(255,140,0,.5))}50%{filter:drop-shadow(0 0 9px rgba(255,140,0,1))}}
.ad-grp{font-weight:800;font-size:12px;padding:6px 11px;border-radius:8px;margin:12px 0 7px;border-left:5px solid #ccc;background:#eef2f6;color:#3a4a5a}
.g-dae{background:#fff6e0;color:#a9781a;border-color:#e6c266}
.g-chg{background:#f2effe;color:#6a4bd0;border-color:#b7a8f0}
.g-tea{background:#fff0e2;color:#cf7521;border-color:#f2b27a}
.g-bk{background:#e4f6f1;color:#12907d;border-color:#7fd3c4}
.g-jo{background:#e9f2ff;color:#1565c0;border-color:#93c0f0}
.g-il{background:#eef1f5;color:#5a6472;border-color:#c2c9d4}
.adr{border:1px solid #eee;border-radius:10px;padding:9px;margin-bottom:8px;font-size:12px}
.adr.off{opacity:.55;background:#fafafa}
.adr-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}.adr-top b{font-size:14px}
.abadge{background:#efe9fb;color:#7e57c2;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px}
.obadge{background:#fdecea;color:#c0392b;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px}
.adr-id{margin-left:auto;color:#9aa0ad;font-size:10px}
.adr-ctrl{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.adr-ctrl select,.adr-ctrl button{font-size:11px;padding:5px 8px;border-radius:7px;border:1px solid #dcdfe6;background:#fff;font-weight:700;cursor:pointer}
.adr-ct{display:flex;align-items:center;gap:4px}.adr-ct input{flex:1;padding:5px 7px;font-size:11px;border:1px solid #e0e0e0;border-radius:7px;min-width:0}
.adr-ct button{font-size:11px;padding:5px 9px;border-radius:7px;border:none;background:#1565c0;color:#fff;font-weight:700}
.menu-item{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:14px;margin-bottom:11px;cursor:pointer;border:1px solid #edeff4}
.menu-item .mi-ic{font-size:23px;width:26px;text-align:center}
.menu-item .mi-tx{display:flex;flex-direction:column;flex:1}
.menu-item .mi-tx b{font-size:15px;color:#2a2f45}
.menu-item .mi-tx i{font-size:12px;color:#8a90a0;font-style:normal;margin-top:2px}
.menu-item .mi-ar{color:#b9bfca;font-size:20px;font-weight:700}
.mi-purple{background:#f4f1fe}.mi-blue{background:#eef4ff}.mi-green{background:#eefaf1}.mi-red{background:#fdeeee}
.mi-purple b{color:#6a4bd0}.mi-blue b{color:#1565c0}.mi-green b{color:#2e8b57}.mi-red b{color:#d0392b}
.btn-back{background:#eef2f6;border:none;color:#3a4a5a;font-weight:800;padding:9px 14px;border-radius:9px;font-size:13px;margin-bottom:12px;cursor:pointer}
/* 홈 */
.home-greet{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(135deg,#4a90e2,#5b6ff0);border-radius:16px;color:#fff;margin-bottom:12px}
.home-greet .hg-emo{font-size:34px}
.home-greet .hg-name{font-size:18px;font-weight:900}
.home-greet .hg-sub{font-size:12px;opacity:.9;margin-top:2px}
.wx{background:linear-gradient(135deg,#7cc0f5,#a9d5f5);border-radius:16px;padding:14px;color:#0f3a5f;margin-bottom:12px}
.wx-top{display:flex;justify-content:space-between;align-items:flex-start}
.wx-now{display:flex;align-items:center;gap:8px}.wx-emo{font-size:38px}
.wx-t{font-size:34px;font-weight:900;line-height:1}.wx-d{font-size:12px;font-weight:700;opacity:.85}
.wx-loc{text-align:right;font-size:12px;font-weight:800}.wx-hilo{font-size:11px;font-weight:600;opacity:.8;margin-top:3px}
.wx-fc{display:flex;gap:8px;margin-top:12px}
.wx-fi{flex:1;background:rgba(255,255,255,.4);border-radius:10px;padding:7px;font-size:11.5px;font-weight:700;text-align:center}.wx-fi span{opacity:.7;margin-right:3px}
.rtwrap{display:flex;gap:8px;margin-bottom:12px}
.rtcard{flex:1;background:#eef4ff;border:1px solid #dbe6fb;border-radius:14px;padding:12px;text-align:center}
.rtcard.rt-today{flex:1.6;background:linear-gradient(135deg,#e8f0ff,#dbe7ff)}
.rt-l{font-size:11px;color:#6a7789;font-weight:700}
.rt-v{font-size:22px;font-weight:900;color:#f5a300;margin-top:4px;letter-spacing:.5px}
.rt-v2{font-size:16px;font-weight:800;color:#5b6b85;margin-top:4px}
.vcheck,.hlth,.fort{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.vc-l{display:flex;align-items:center;gap:11px}.vc-ic{font-size:24px}
.vc-l b{font-size:14px;color:#2a2f45;display:block}.vc-l i{font-size:11.5px;color:#8a90a0;font-style:normal}
.vcheck{background:linear-gradient(135deg,#ff8a5b,#ff6f61);border:none}.vcheck b,.vcheck i{color:#fff!important}
.vcheck.vdone{background:#fff;border:1px solid #edeff4}.vcheck.vdone b{color:#2a2f45!important}.vcheck.vdone i{color:#2e8b57!important}
.vc-btn{background:rgba(255,255,255,.9);color:#e8562e;border:none;font-weight:800;padding:8px 14px;border-radius:9px;font-size:12px;cursor:pointer}
.vc-ok{color:#2e8b57;font-size:20px;font-weight:900}
.fort{background:linear-gradient(135deg,#6a7bd0,#8a6fd0)}.fort b,.fort i{color:#fff!important}.fort .mi-ar{color:#fff}
.hstat{display:flex;gap:8px;margin-top:2px}
.hs{flex:1;background:#eefaf1;border:1px solid #d8f0e0;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer}
.hs.hs-mid{background:#eef4ff;border-color:#dbe6fb}
.hs-n{font-size:22px;font-weight:900;color:#2a2f45}
.hs-l{font-size:11px;color:#7a8699;margin-top:3px}
.pb-stat .s .v{font-size:16px}.pb-stat{gap:6px}
.pb-miss{display:flex;flex-wrap:wrap;gap:6px}
.miss-chip{background:#fdeeee;color:#d0392b;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px}
</style>
</head>
<body>
<div class="wrap">
  <!-- 로그인 -->
  <div id="login">
    <div class="llogo">🚚</div>
    <div class="ltit">소원물류</div>
    <div class="lsub">기사 업무 포털</div>
    <div class="lbox">
      <h2>로그인</h2>
      <div class="fg"><label>기사명</label><input id="li-name" autocomplete="username" placeholder="이름"></div>
      <div class="fg"><label>비밀번호</label><input id="li-pw" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
      <button class="btn-p" id="li-btn">로그인</button>
      <div class="lhint">처음 로그인 시 비밀번호는 <b>1234</b> 입니다. 로그인 후 설정에서 변경하세요.</div>
      <div class="msg" id="li-msg"></div>
    </div>
  </div>

  <!-- 앱 -->
  <div id="app">
    <div class="ah">
      <div class="av" id="av">·</div>
      <div><div class="an" id="an"></div><div class="ar" id="ar"></div></div>
      <button class="lo" id="logout">로그아웃</button>
    </div>
    <div class="mc">
      <!-- 홈 -->
      <div class="scr on" id="s-home"><div class="center">불러오는 중…</div></div>
      <!-- 스케줄 -->
      <div class="scr" id="s-sched">
        <div class="wknav"><button id="wk-prev">◀ 지난주</button><span id="wk-lbl"></span><button id="wk-next">다음주 ▶</button></div>
        <div class="wkbtns"><button id="wk-today">📍 오늘로</button><button id="wk-edit">✏️ 수정</button></div>
        <div id="sc-body"><div class="center">불러오는 중…</div></div>
        <div class="notice" id="sc-note"></div>
      </div>
      <!-- 정산 -->
      <div class="scr" id="s-settle">
        <div id="st-list"><div class="center">불러오는 중…</div></div>
        <div id="st-detail"></div>
      </div>
      <!-- 프백 -->
      <div class="scr" id="s-pback">
        <div id="pb-admin"></div>
        <div id="pb-driver">
        <div class="card">
          <div class="ct">📸 프레시백 소명 작성</div>
          <label class="fl">정산 기간/주차</label><input id="pb-period" placeholder="예: 06월 4주차">
          <label class="fl">라우트</label><input id="pb-route" placeholder="예: 302A">
          <label class="fl">사진 (최대 2장)</label><input id="pb-photos" type="file" accept="image/*" multiple>
          <label class="fl">소명 내용</label><textarea id="pb-reason" rows="3" placeholder="회수/미회수 사유"></textarea>
          <button class="btn-p" id="pb-submit">소명 제출</button>
          <div class="msg" id="pb-msg"></div>
        </div>
        <div class="card"><div class="ct">📋 내 소명 내역</div><div id="pb-list"><div class="center">불러오는 중…</div></div></div>
        <div class="notice">📷 사진은 소원 클라우드에 저장됩니다.</div>
        </div>
      </div>
      <!-- 설정 -->
      <div class="scr" id="s-set">

async function rpc(fn,args){
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(args||{})});

}

const WX=c=>{if(c===0)return["☀️","맑음"];if(c<=3)return["⛅","대체로 맑음"];if(c<=48)return["🌫️","안개"];if(c<=57)return["🌦️","이슬비"];if(c<=67)return["🌧️","비"];if(c<=77)return["🌨️","눈"];if(c<=82)return["🌦️","소나기"];if(c<=86)return["🌨️","눈"];return["⛈️","뇌우"];};

  }catch(e){return '';}

async function homeRoutes(){

    const ws=mondayOf(new Date());const rows=await rpc("list_schedules",{p_token:S.token,p_week_start:iso(ws)});

/* 스케줄 */
$("#wk-prev").onclick=()=>{weekStart.setDate(weekStart.getDate()-7);loadSched();};

async function loadSched(){
  $("#wk-lbl").textContent="8/2(일) ~ 8/8(토)";
  $("#sc-note").textContent=(CAN_EDIT()&&editMode)?"✏️ 수정중 — 셀을 눌러 기사 변경 (자동 기록)":(CAN_EDIT()?"✏️ 수정 버튼을 누르면 편집 가능":"조회 전용");
  $("#sc-body").innerHTML='<div class="center">불러오는 중…</div>';
  try{
    const _ws=iso(weekStart);let rows=schedCache[_ws];if(!rows){rows=await rpc("list_schedules",{p_token:S.token,p_week_start:_ws});schedCache[_ws]=rows;}
    if(!rows.length){$("#sc-body").innerHTML='<div class="center">이번 주 스케줄이 아직 없습니다.</div>';return;}
    const dates=[...new Set(rows.map(r=>r.work_date))].sort();
    const map={},campR={};
    rows.forEach(r=>{map[r.route+"|"+r.work_date]=r.driver_name;const cp=r.camp||"기타";(campR[cp]=campR[cp]||new Set()).add(r.route);});
    const camps=Object.keys(campR).sort((a,b)=>((parseInt(b.replace(/\D/g,''))||0)-(parseInt(a.replace(/\D/g,''))||0)));
    const t=new Date();const today=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    const WD=["일","월","화","수","목","금","토"];const ed=CAN_EDIT()&&editMode;
    function headCells(){let s='<th>라우트</th>';dates.forEach(d=>{const dd=new Date(d+"T00:00");const g=dd.getDay();const we=(g===0||g===6)?" we":"";const to=(d===today)?" tcol":"";s+='<th class="'+(we+to).trim()+'">'+(dd.getMonth()+1)+'/'+dd.getDate()+'<br>'+WD[g]+(d===today?'<span class="tlbl">🚚 오늘</span>':'')+'</th>';});return s;}
    let h="";
    camps.forEach(cp=>{
      const rts=[...campR[cp]].sort();
      h+='<div class="camp-card"><div class="camp-head"><span>📦 '+cp+'</span><span class="rc">'+rts.length+'개 라우트</span></div><div class="tbl-wrap"><div class="tbl-inner"><table class="sched"><thead><tr>'+headCells()+'</tr></thead><tbody>';
      rts.forEach(rt=>{
        h+='<tr><td class="cRoute">'+rt+'</td>';
        dates.forEach(d=>{const nm=map[rt+"|"+d]||"";const rk=RANKMAP[nm];const to=(d===today);
          const da=ed?' data-d="'+d+'" data-rt="'+rt+'" data-cp="'+cp+'" data-nm="'+nm+'" style="cursor:pointer"':'';
          let cls;if(rk){cls="rk "+RCLS[rk]+(to?" tcol":"");}else{cls=to?"tcol tbg":"";}
          h+='<td class="'+cls+'"'+da+'>'+(rk?RMARK[rk]+" ":"")+nm+'</td>';});
        h+='</tr>';
      });
      h+='</tbody></table><div class="today-box"></div></div></div></div>';
    });
    $("#sc-body").innerHTML=h;
    function place(){$("#sc-body").querySelectorAll(".tbl-inner").forEach(inner=>{
      const th=inner.querySelector("th.tcol"),box=inner.querySelector(".today-box"),tbl=inner.querySelector("table");
      if(!th||!box){if(box)box.style.display="none";return;}
      box.style.left=th.offsetLeft+"px";box.style.top="0px";box.style.width=th.offsetWidth+"px";box.style.height=tbl.offsetHeight+"px";});}
    place();setTimeout(place,150);window.onresize=place;
    if(ed){$("#sc-body").querySelectorAll('td[data-rt]').forEach(td=>{td.onclick=()=>editCell(td.dataset.d,td.dataset.rt,td.dataset.cp,td.dataset.nm);});}
  }catch(e){$("#sc-body").innerHTML='<div class="center">'+e.message+'</div>';}
}

    h+='<div class="admstat"><div class="s"><div class="l">총 기사수</div><div class="v">'+rows.length+'명</div></div><div class="s"><div class="l">세금계산서 합계</div><div class="v">'+won(tg)+'</div></div><div class="s main"><div class="l">총 지급액 합계</div><div class="v">'+won(tn)+'</div></div></div>';
    if(!rows.length){h+='<div class="card"><div class="center">해당 월 정산 내역이 없습니다.</div></div>';box.innerHTML=h;return;}
    h+='<div class="card"><div class="ct">👥 기사별 지급액 <span style="font-size:11px;color:#98a3b3;font-weight:400">(이름 클릭 → 상세)</span></div><table class="stbl"><thead><tr><th>기사</th><th>직급</th><th>세금계산서</th><th>실지급액</th></tr></thead><tbody>';
    rows.forEach(r=>{h+='<tr class="clk" onclick="openDriverSettle(\''+r.driver_name+'\','+y+','+m+')"><td><b style="color:#1565c0">'+r.driver_name+'</b></td><td style="text-align:left"><span class="rkchip '+(RCLS[r.rank]||'')+'">'+r.rank+'</span></td><td>'+won(r.gross)+'</td><td><b>'+won(r.net)+'</b></td></tr>';});
    h+='</tbody></table></div>';
    box.innerHTML=h;
  }catch(e){box.innerHTML='<div class="center">'+e.message+'</div>';}
}
function settleHTML(d){
  const g=k=>d[k]!=null?d[k]:0;
  const 발행=g("발행금액"),공급=g("공급가액"),실지급=(d["실지급"]!=null?d["실지급"]:g("net")),차감=g("차감"),산재=g("산재"),고용=g("고용");
  const rev=d["수익"]||null, dl=d["일별"]||[];
  const hasDetail=(rev&&rev.length)||dl.length>0;
  let h='';
  h+='<div class="st-head"><div class="col"><div class="l">세금계산서 발행금액</div><div class="v">'+won(발행)+'</div></div><div class="col main"><div class="l">실지급액</div><div class="v">'+won(실지급)+'</div></div></div>';
  if(rev&&rev.length){
    h+='<div class="card"><div class="ct">📦 수익 내역</div><div class="stbl-wrap" style="max-height:none"><table class="stbl"><thead><tr><th>내역(라우트)</th><th>구분</th><th>수량</th><th>단가</th><th>소계</th></tr></thead><tbody>';
    rev.forEach(x=>{const lab=x.g==="프백"?"프레시백":(x.g==="반품"?"반품":"배송");h+='<tr><td style="font-size:11px;color:#555">'+(x.n||"-")+'</td><td>'+lab+'</td><td>'+(x.q?x.q.toLocaleString():"-")+'</td><td>'+(x.p?won(x.p):"-")+'</td><td>'+won(x.s)+'</td></tr>';});
    h+='<tr class="tot"><td colspan="4">세금계산서 발행금액</td><td>'+won(발행)+'</td></tr>';
    h+='</tbody></table></div></div>';
  }
  h+='<div class="card"><div class="ct">➖ 차감 내역 (본인부담 50%)</div><table class="stbl"><tbody>';
  h+='<tr class="minus"><td>산재보험</td><td class="r">-'+won(산재)+'</td></tr>';
  h+='<tr class="minus"><td>고용보험</td><td class="r">-'+won(고용)+'</td></tr>';
  h+='<tr class="tot"><td>차감 합계</td><td class="r">-'+won(차감)+'</td></tr>';
  h+='<tr class="tot main"><td>실지급액 (발행금액 − 차감)</td><td class="r">'+won(실지급)+'</td></tr>';
  h+='</tbody></table><div class="note">공급가액 '+won(공급)+' · 경비율 34.6% 반영</div></div>';
  if(!hasDetail){h+='<div class="card"><div class="center" style="color:#8a94a6;font-size:12.5px;line-height:1.6">수익·일별 세부 내역은<br>정산 프로그램 연동 시 표시됩니다.</div></div>';}
  if(dl.length){
    let s0=0,s1=0,s2=0,s3=0,rr='';
    dl.forEach(r=>{const dt=r[0],rt=r[1],a=+r[2]||0,b=+r[3]||0,c=+r[4]||0,e=+r[5]||0;s0+=a;s1+=b;s2+=c;s3+=e;rr+='<tr><td>'+dt+'</td><td>'+rt+'</td><td>'+a+'</td><td>'+b+'</td><td>'+(c||"-")+'</td><td>'+(e?won(e):"-")+'</td></tr>';});
    h+='<div class="card"><div class="ct">🗓️ 일별 상세</div><div class="stbl-wrap"><table class="stbl day"><thead><tr><th>날짜</th><th>라우트</th><th>배송</th><th>반품</th><th>수기</th><th>프백</th></tr></thead><tbody>'+rr+'<tr class="tot"><td colspan="2">합계</td><td>'+s0.toLocaleString()+'</td><td>'+s1.toLocaleString()+'</td><td>'+s2.toLocaleString()+'</td><td>'+won(s3)+'</td></tr></tbody></table></div></div>';
  }
  return h;
}
window.openDetail=async(y,m)=>{
  $("#st-detail").innerHTML='<div class="center">불러오는 중…</div>';
  try{
    const d=await rpc("get_my_settlement",{p_token:S.token,p_year:y,p_month:m});

  }catch(e){$("#st-detail").innerHTML='<div class="center">'+e.message+'</div>';}

window.openDriverSettle=async(name,y,m)=>{
  $("#st-detail").innerHTML='<div class="center">불러오는 중…</div>';window.scrollTo(0,0);
  try{
    const d=await rpc("admin_get_settlement",{p_token:S.token,p_name:name,p_year:y,p_month:m});
    if(!d){$("#st-detail").innerHTML='<div class="card"><div class="center">'+name+' 명세서가 없습니다.</div><div class="center"><button class="mini" onclick="document.getElementById(\'st-detail\').innerHTML=\'\'">닫기</button></div></div>';return;}
    const bar='<div class="admnav"><button onclick="document.getElementById(\'st-detail\').innerHTML=\'\';window.scrollTo(0,0)">◀ 목록</button><b>'+name+' · '+y+'년 '+m+'월</b><span style="width:34px"></span></div>';
    $("#st-detail").innerHTML=bar+settleHTML(d);window.scrollTo(0,0);
  }catch(e){$("#st-detail").innerHTML='<div class="center">'+e.message+'</div>';}
};
/* 프백 */
async function uploadPhoto(f){
  const p=S.name+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+f.name.replace(/[^\w.\-]/g,"");
  const r=await fetch(SUPABASE_URL+"/storage/v1/object/pback-images/"+encodeURIComponent(p),{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":f.type||"image/jpeg"},body:f});
  if(!r.ok)throw new Error("사진 업로드 실패");
  return SUPABASE_URL+"/storage/v1/object/public/pback-images/"+p;
}
$("#pb-submit").onclick=async()=>{
  const period=$("#pb-period").value.trim(),route=$("#pb-route").value.trim(),reason=$("#pb-reason").value.trim();
  const files=[...$("#pb-photos").files].slice(0,2);
  if(!reason){msg("#pb-msg","err","소명 내용을 입력하세요.");return;}
  $("#pb-submit").disabled=true;msg("#pb-msg","ok","제출 중…");
  try{
    const urls=[];for(const f of files)urls.push(await uploadPhoto(f));
    await rpc("submit_pback",{p_token:S.token,p_period:period,p_route:route,p_photo1:urls[0]||null,p_photo2:urls[1]||null,p_reason:reason});
    msg("#pb-msg","ok","제출 완료!");$("#pb-reason").value="";$("#pb-photos").value="";loadPback();
  }catch(e){msg("#pb-msg","err",e.message);}
  $("#pb-submit").disabled=false;
};
function pbPeriod(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
async function loadPback(){
  if(IS_ADMIN()){$("#pb-driver").style.display="none";$("#pb-admin").style.display="block";return renderPbackAdmin();}
  $("#pb-driver").style.display="block";$("#pb-admin").style.display="none";
  $("#pb-list").innerHTML='<div class="center">불러오는 중…</div>';
  try{
    const rows=await rpc("list_my_pback",{p_token:S.token,p_period:null});
    if(!rows.length){$("#pb-list").innerHTML='<div class="center">제출한 소명이 없습니다.</div>';return;}
    let h='';rows.forEach(r=>{const done=/인정|완료/.test(r.status||"");h+='<div class="somyeong"><div class="top"><span class="rt">'+(r.route||'')+' · '+(r.period||'')+'</span><span class="pill '+(done?'p-done':'p-wait')+'">'+(r.status||'검토중')+'</span></div><div style="color:#666">'+(r.reason||'')+'</div></div>';});
    $("#pb-list").innerHTML=h;
  }catch(e){$("#pb-list").innerHTML='<div class="center">'+e.message+'</div>';}
}
window.pbSaveUrl=async()=>{const u=$("#pb-formurl").value.trim();try{await rpc("admin_set_pback_config",{p_token:S.token,p_period:pbPeriod(),p_form_url:u,p_submit_mode:null,p_active:true});msg("#pb-adm-msg","ok","폼 URL 저장됨");}catch(e){msg("#pb-adm-msg","err",e.message);}};
window.pbDecide=async(id,st)=>{try{await rpc("admin_pback_decide",{p_token:S.token,p_id:id,p_status:st});renderPbackAdmin();}catch(e){alert(e.message);}};
async function renderPbackAdmin(){
  const box=$("#pb-admin");box.innerHTML='<div class="center">불러오는 중…</div>';
  try{
    const d=await rpc("admin_pback_dashboard",{p_token:S.token,p_period:pbPeriod()});
    const cfg=d.config||{};const subs=d.submissions||[];const notsub=d.not_submitted||[];
    let h='<div class="admnav"><b>🧾 프백 소명 · 관리자</b><span style="font-size:11px;color:#98a3b3">'+d.period+'</span></div>';
    h+='<div class="admstat pb-stat"><div class="s"><div class="l">대상</div><div class="v">'+(d.target_cnt||0)+'</div></div><div class="s"><div class="l">제출완료</div><div class="v">'+(d.submitted_cnt||0)+'</div></div><div class="s"><div class="l">소명불가</div><div class="v">'+(d.impossible_cnt||0)+'</div></div><div class="s main"><div class="l">미제출</div><div class="v">'+notsub.length+'</div></div></div>';
    h+='<div class="card"><label class="fl">📋 소명 제출 폼 URL</label><div class="adr-ct"><input id="pb-formurl" value="'+(cfg.form_url||"")+'" placeholder="https://docs.google.com/forms/..."><button onclick="pbSaveUrl()">저장</button></div><div class="msg" id="pb-adm-msg"></div><div class="note">대상 명단은 소원 스케줄 프로그램에서 업로드하면 자동 반영됩니다.</div></div>';
    h+='<div class="card"><div class="ct">🕓 승인 대기 ('+(d.pending_cnt||0)+')</div>';
    const pend=subs.filter(s=>/검토/.test(s.status));
    if(!pend.length)h+='<div class="center" style="color:#9aa;font-size:12px">없음</div>';
    pend.forEach(s=>{h+='<div class="somyeong"><div class="top"><span class="rt">'+s.name+' · '+(s.route||"")+'</span><span><button class="mini" onclick="pbDecide('+s.id+',\'인정\')">인정</button> <button class="mini" style="background:#fdeeee;color:#d0392b" onclick="pbDecide('+s.id+',\'소명불가\')">불가</button></span></div><div style="color:#666;font-size:12px">'+(s.reason||"")+'</div></div>';});
    h+='</div>';
    h+='<div class="card"><div class="ct">✅ 제출 완료 ('+(d.submitted_cnt||0)+')</div>';
    const done=subs.filter(s=>/제출|인정|완료/.test(s.status));
    if(!done.length)h+='<div class="center" style="color:#9aa;font-size:12px">없음</div>';
    done.forEach(s=>{h+='<div class="somyeong"><div class="top"><span class="rt">'+s.name+' · '+(s.route||"")+'</span><span class="pill p-done">'+s.status+'</span></div><div style="color:#666;font-size:12px">'+(s.reason||"")+'</div></div>';});
    h+='</div>';
    h+='<div class="card"><div class="ct">⏳ 미제출 ('+notsub.length+')</div>';
    if(!notsub.length)h+='<div class="center" style="color:#9aa;font-size:12px">대상 명단 없음 (스케줄 프로그램 연동 대기)</div>';
    else h+='<div class="pb-miss">'+notsub.map(t=>'<span class="miss-chip">'+t.name+(t.route?" "+t.route:"")+'</span>').join('')+'</div>';
    h+='</div>';
    box.innerHTML=h;
  }catch(e){box.innerHTML='<div class="center">'+e.message+'</div>';}
}
/* 설정 */
const IS_ADMIN=()=>S&&(S.is_admin||S.rank==="대표");
function setMenu(){$("#set-menu").classList.remove("hide");$("#set-sub").classList.add("hide");$("#mi-perm").classList.toggle("hide",!IS_ADMIN());$("#me-info").innerHTML='<div class="kv"><span>이름</span><b>'+S.name+'</b></div><div class="kv"><span>직급</span><b>'+S.rank+'</b></div>'+(IS_ADMIN()?'<div class="kv"><span>관리자</span><b>예</b></div>':'');}
function openSub(name){$("#set-menu").classList.add("hide");$("#set-sub").classList.remove("hide");["pw","me","perm"].forEach(x=>$("#sub-"+x).classList.toggle("hide",x!==name));if(name==="perm")loadAdmin();}
document.addEventListener("click",e=>{if(e.target.id==="set-back"){setMenu();return;}const mi=e.target.closest?e.target.closest(".menu-item"):null;if(!mi)return;if(mi.id==="mi-logout"){localStorage.removeItem("sowon_session");location.reload();}else openSub(mi.id.replace("mi-",""));});
const RANKS=["대표","총괄","팀장","조장","일반","백업"];
async function loadAdmin(){$("#ad-list").innerHTML='<div class="center">불러오는 중…</div>';try{window.__adrows=await rpc("admin_list_drivers",{p_token:S.token});renderAdmin();}catch(e){$("#ad-list").innerHTML='<div class="center">'+e.message+'</div>';}}
function renderAdmin(){
  const RORD={"대표":0,"총괄":1,"팀장":2,"백업":3,"조장":4,"일반":5};const GCLS={"대표":"g-dae","총괄":"g-chg","팀장":"g-tea","백업":"g-bk","조장":"g-jo","일반":"g-il"};
  const q=($("#ad-search").value||"").trim();let rows=(window.__adrows||[]).slice().sort((a,b)=>((RORD[a.rank]??9)-(RORD[b.rank]??9))||a.name.localeCompare(b.name));if(q)rows=rows.filter(r=>r.name.includes(q));
  let h="",cur=null;
  rows.forEach(r=>{if(r.rank!==cur){cur=r.rank;h+='<div class="ad-grp '+(GCLS[r.rank]||'')+'">'+r.rank+'</div>';}
    const off=r.status!=="active";
    h+='<div class="adr'+(off?" off":"")+'" data-name="'+r.name+'"><div class="adr-top"><b>'+r.name+'</b>'
      +(r.is_admin?'<span class="abadge">관리자</span>':'')+(off?'<span class="obadge">'+r.status+'</span>':'')
      +'<span class="adr-id">'+(r.driver_id||'')+'</span></div>'
      +'<div class="adr-ctrl"><select class="ad-rank">'+RANKS.map(rk=>'<option'+(rk===r.rank?" selected":"")+'>'+rk+'</option>').join('')+'</select>'
      +'<button class="ad-adm">'+(r.is_admin?"관리자해제":"관리자지정")+'</button>'
      +'<button class="ad-stat">'+(off?"복구":"정지")+'</button><button class="ad-pw">PW초기화</button></div>'
      +'<div class="adr-ct">📞<input class="ad-ph" value="'+(r.phone||'')+'" placeholder="전화"><input class="ad-vh" value="'+(r.vehicle_no||'')+'" placeholder="차량번호"><button class="ad-save">저장</button></div></div>';});
  $("#ad-list").innerHTML=h||'<div class="center">기사가 없습니다.</div>';
  $("#ad-list").querySelectorAll(".adr").forEach(row=>{const nm=row.dataset.name;const cur=()=>window.__adrows.find(x=>x.name===nm);
    row.querySelector(".ad-rank").onchange=e=>adUpd(nm,{p_rank:e.target.value});
    row.querySelector(".ad-adm").onclick=()=>adUpd(nm,{p_is_admin:!cur().is_admin});
    row.querySelector(".ad-stat").onclick=()=>adUpd(nm,{p_status:cur().status==="active"?"정지":"active"});
    row.querySelector(".ad-pw").onclick=()=>adResetPw(nm);
    row.querySelector(".ad-save").onclick=()=>adUpd(nm,{p_phone:row.querySelector(".ad-ph").value,p_vehicle_no:row.querySelector(".ad-vh").value});});
}
async function adUpd(name,fields){try{await rpc("admin_update_driver",Object.assign({p_token:S.token,p_name:name,p_rank:null,p_status:null,p_is_admin:null,p_phone:null,p_vehicle_no:null,p_vehicle_type:null,p_birth:null,p_is_ev:null,p_is_public:null},fields));await loadAdmin();}catch(e){alert(e.message);}}
async function adResetPw(name){if(!confirm(name+" 비밀번호를 1234로 초기화할까요?"))return;try{await rpc("admin_reset_pw",{p_token:S.token,p_name:name});alert("초기화됨 (비번 1234)");}catch(e){alert(e.message);}}
document.addEventListener("input",e=>{if(e.target.id==="ad-search")renderAdmin();});
document.addEventListener("click",e=>{if(e.target.id==="ad-add"){(async()=>{const name=prompt("기사명");if(!name)return;const rank=prompt("직급 (대표/총괄/팀장/조장/일반/백업)","일반")||"일반";const phone=prompt("전화번호(선택)","")||"";const vh=prompt("차량번호(선택)","")||"";try{await rpc("admin_add_driver",{p_token:S.token,p_name:name,p_rank:rank,p_phone:phone,p_vehicle_no:vh});await loadAdmin();alert(name+" 추가됨 (비번 1234)");}catch(err){alert(err.message);}})();}});
$("#pw-btn").onclick=async()=>{
  const o=$("#pw-old").value,n=$("#pw-new").value;if(!o||!n){msg("#pw-msg","err","입력하세요.");return;}
  try{const ok=await rpc("change_password",{p_token:S.token,p_old:o,p_new:n});

  }catch(e){msg("#pw-msg","err",e.message);}
};
$("#logout").onclick=()=>{localStorage.removeItem("sowon_session");location.reload();};

(function(){const raw=localStorage.getItem("sowon_session");if(raw){try{S=JSON.parse(raw);enterApp();}catch(e){}}})();
